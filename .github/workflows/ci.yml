name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Verify release API
        run: python scripts/verify_release.py

      - name: Run pytest
        run: pytest -q

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev + lint deps
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" ruff mypy scipy-stubs

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy fhe_oracle

  tenseal:
    name: Native TenSEAL (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -e ".[dev,tenseal]"
      - name: Require native backend
        run: python -c "import tenseal; print(tenseal.__version__)"
      - name: Native integration tests
        run: pytest -q tests/test_tenseal_adapter.py tests/test_tenseal_circuit2.py tests/test_evaluation_safety.py
